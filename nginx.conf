# Flick Web static site (used by the Dockerfile)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Security headers. The full Content-Security-Policy is in index.html (written at build time);
    # this one adds what a <meta> tag can't do: stop other sites from embedding Flick (clickjacking).
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Calls and voice notes need the camera and microphone; nothing else is allowed
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Built files have a content hash in their name, so browsers may keep them for a year.
    # ("expires" is used instead of add_header so the security headers above still apply.)
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The page itself is always checked again, so a new deploy shows up straight away
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
